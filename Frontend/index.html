<!DOCTYPE html>
<html>
    <head>
        <title>MINI APP</title>
        <link rel="stylesheet" href="style.css">
        <script src="script.js" defer></script>
    </head>

    <body>
        <div id="loginSection">
            <h1>PAPAYA EDITOR</h1>
            <h2>Login</h2>
            <input id="usernameInput" type="text" placeholder="Username"><br><br>
            <input id="passwordInput" type="password" placeholder="Password"><br><br>
            <button id="loginBtn">Login</button>
            <br>
            <br>
            <img src="src/mimi.png" alt="kitty2" width="400" height="250">
            <p id="errorMsg" style="color:red;"></p>
        </div>

        <div id="editorSection">
            <h1>Mini Papaya - Editor</h1>
            <p>Small Web Application to write some small text</p>
            <img src="src/kitten.png" alt="kitten" width="400" height="300">
            <br>
            <textarea id="text" type="text" placeholder="Write your text here"></textarea>
            <button id="downloadBtn">Download as txt File</button>
        </div>
    </body>
</html>
